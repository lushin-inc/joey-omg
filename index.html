<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joey Boyd · OMG Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f6f4ef; --panel:#ffffff; --panel2:#eef0f3; --line:#dcdfe4;
  --text:#1d2733; --mut:#5c6a79; --faint:#93a0ad;
  --amber:#b57312;
  --good:#2e8f60; --mid:#d9a13c; --bad:#c14343;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px 80px}
header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#ffffff 0%,var(--ink) 100%)}
.hd{max-width:1040px;margin:0 auto;padding:32px 24px 24px}
.brand .eyebrow{font-family:'Barlow Condensed';font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:13px;color:var(--amber)}
.brand h1{font-family:'Barlow Condensed';font-weight:700;font-size:44px;line-height:1;margin-top:6px}
.brand h1 span{color:var(--mut);font-weight:500}
.hirebtn{display:inline-block;margin-top:20px;font-family:'Barlow Condensed';font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:14px 28px;border-radius:30px;background:var(--amber);color:#fff;text-decoration:none;box-shadow:0 4px 14px rgba(181,115,18,.3)}
.hirebtn:hover{background:#9c620d}
.hirebtn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

h2{font-family:'Barlow Condensed';font-weight:600;font-size:23px;letter-spacing:.06em;text-transform:uppercase;margin:36px 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:0 1px 2px rgba(29,39,51,.05)}
.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px 12px}
.gauge{text-align:center;border-radius:12px;padding:6px 0;transition:background .4s, box-shadow .4s}
.gauge.flash{background:#fbf1e2;box-shadow:0 0 0 2px var(--amber)}
.gauge .gl{font-family:'Barlow Condensed';font-weight:600;font-size:14.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);min-height:34px;display:flex;align-items:flex-end;justify-content:center;line-height:1.15;margin-bottom:4px}
.gauge svg{width:100%;max-width:170px}
.gauge .gv{font-family:'Barlow Condensed';font-weight:700;font-size:30px;line-height:1;margin-top:-6px;font-variant-numeric:tabular-nums}
.gauge .gz{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

/* focus areas */
.focus{display:grid;gap:12px}
.fcard{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:var(--r);box-shadow:0 1px 2px rgba(29,39,51,.05)}
.fcard summary{list-style:none;cursor:pointer;padding:20px 22px;display:flex;align-items:center;gap:16px}
.fcard summary::-webkit-details-marker{display:none}
.fcard summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:var(--r)}
.fnum{flex:none;width:36px;height:36px;border-radius:50%;background:var(--amber);color:#fff;font-family:'Barlow Condensed';font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.ftitle{flex:1;font-family:'Barlow Condensed';font-weight:600;font-size:22px;letter-spacing:.03em;line-height:1.15}
.chev{flex:none;width:12px;height:12px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin-right:6px;transition:transform .2s}
.fcard[open] .chev{transform:rotate(-135deg);margin-top:8px}
.fbody{padding:0 22px 22px 74px}
@media(max-width:640px){.fbody{padding:0 18px 20px 18px}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:5px 12px 5px 14px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;font-family:'Inter'}
.chip:hover{border-color:var(--amber)}
.chip b{font-family:'Barlow Condensed';font-size:17px;font-weight:700}
.blk{margin-top:12px}
.blk:first-of-type{margin-top:0}
.blk .lead{font-weight:600}
.blk ul{margin:6px 0 0 20px}
.blk li{margin:4px 0;color:#2a3542}

/* beliefs */
.bel{display:grid;gap:10px}
.belrow{border-bottom:1px solid var(--panel2);padding-bottom:10px}
.belrow:last-child{border-bottom:none;padding-bottom:0}
.belnow{color:var(--bad);font-size:13.5px}
.belnew{color:var(--good);font-weight:600;font-size:13.5px;margin-top:2px}
.belnew:before{content:'\2192\00a0';font-weight:700}
details.callout{background:#fbf6ee;border:1px solid #ecd3a0;border-left:5px solid var(--amber);border-radius:var(--r)}
details.callout summary{list-style:none;cursor:pointer;padding:18px 22px;display:flex;align-items:center;gap:16px}
details.callout summary::-webkit-details-marker{display:none}
details.callout .ctitle{flex:1;font-family:'Barlow Condensed';font-weight:600;font-size:20px;letter-spacing:.03em}
details.callout[open] .chev{transform:rotate(-135deg);margin-top:8px}
details.callout .cbody{padding:0 22px 22px}

.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:12px;margin-top:14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{color:var(--mut);font-size:12.5px;margin-top:6px;max-width:720px}

.gauge.has-bd{cursor:pointer}
.gauge.has-bd:hover{background:#faf6ef}
.gauge.has-bd:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.bdlink{font-size:11.5px;font-weight:600;color:var(--amber);margin-top:6px}
.gauge.has-bd:hover .bdlink{text-decoration:underline}
#detail{position:fixed;inset:0;z-index:300;background:var(--ink);overflow-y:auto;display:none}
#detail.on{display:block}
.dwrap{max-width:820px;margin:0 auto;padding:28px 24px 80px}
.dtop{display:flex;justify-content:flex-end;position:sticky;top:0;padding-top:8px}
.dclose{font-family:'Barlow Condensed';font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:10px 22px;border-radius:24px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.dclose:hover{border-color:var(--amber);color:var(--amber)}
.dname{font-size:15px;color:var(--mut);margin-top:4px}
.dtitle{font-family:'Barlow Condensed';font-weight:700;font-size:46px;line-height:1.05;margin-top:2px}
.dscore{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.dscore .n{font-family:'Barlow Condensed';font-weight:700;font-size:56px;line-height:1}
.dscore .z{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.ddef{color:var(--mut);font-size:14px;margin-top:10px;max-width:640px}
.dgroup{margin-top:28px}
.dgroup h3{font-family:'Barlow Condensed';font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.drow{display:flex;gap:16px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.dico{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:1px}
.dico.y{background:var(--good)}
.dico.n{border:2px solid var(--bad);background:#fff}
.dico.y:after{content:'';width:6px;height:11px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg);margin-top:-3px}
.drow .t{font-weight:600;font-size:15px}
.drow .d{color:var(--mut);font-size:13.5px;margin-top:3px}
.mstyle{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.mbar .ml{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between}
.mbar .track{height:14px;border-radius:7px;background:var(--panel2);overflow:hidden}
.mbar .fill{height:100%;border-radius:7px;background:var(--amber)}
.mbar.dim .fill{background:var(--faint)}
/* definitions */
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--faint);background:none;color:var(--faint);font-family:'Inter';font-size:10px;font-weight:600;cursor:pointer;margin-left:6px;flex:none;vertical-align:1px}
.info-btn:hover,.info-btn[aria-expanded="true"]{border-color:var(--amber);color:var(--amber)}
.info-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#defpop{position:absolute;z-index:200;max-width:280px;background:#1d2733;color:#f2f5f8;border-radius:8px;padding:12px 14px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 20px rgba(29,39,51,.3);display:none;text-align:left}
#defpop .dp-title{font-family:'Barlow Condensed';font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:#eec27f;margin-bottom:4px}
#defpop:after{content:'';position:absolute;top:-6px;left:var(--arrow,20px);border:6px solid transparent;border-top:none;border-bottom-color:#1d2733}
</style>
</head>

<script>
const DATA = {"name": "Joey Boyd", "will": {"Desire": 70, "Commitment": 38, "Outlook": 50, "Responsibility": 83, "Motivation": 90}, "dev": {"Will to Sell": 65, "Coachable": 78, "Figure-It-Out-Factor": 55}, "dna": {"Doesn't Need Approval": 87, "Stays in the Moment": 78, "Supportive Beliefs": 80, "Supportive Buy Cycle": 29, "Comfortable Discussing Money": 50, "Handles Rejection": 83}, "tac": {"Hunting": 44, "Reaching Decision-Makers": 15, "Relationship Building": 46, "Consultative Selling": 77, "Selling Value": 65, "Qualifying": 51, "Presentation Approach": 95, "Closing": 71, "Sales Process": 53, "Sales Technology": 4}, "other": {"Sales Posturing": 78, "Negotiating": 55, "Building Trust": 87, "Account Management": 43, "Farming": 45, "Working Remotely": 51}};
const FOCUS = [{"title": "Set a firm follow-up appointment on the first visit", "scores": ["Qualifying", "Sales Process"], "blocks": [{"lead": "What's happening:", "items": ["Homeowners who seemed warm at the door stop responding afterward", "The first conversation often ends without a clear, scheduled next step, so the follow-up isn't solid enough to hold"]}, {"lead": "Joey:", "items": ["Go into every first visit with one goal: a scheduled follow-up appointment with a day and time", "Before leaving, confirm who will be there and what you'll go over together: the photos, the annotated report, and the options", "If a homeowner who was warm at the door goes quiet over text or phone, go back and meet with them in person"]}]}, {"title": "Get both decision-makers to the follow-up", "scores": ["Reaching Decision-Makers", "Qualifying"], "blocks": [{"lead": "What's happening:", "items": ["Usually one spouse answers the door, and often says the other one handles this kind of decision", "Counting on the person at the door to sell their spouse usually doesn't work out"]}, {"lead": "Joey:", "items": ["Ask early: \u201cHow do you guys go about deciding on something like this?\u201d", "Use \u201cmy husband handles this stuff\u201d as the reason to set the follow-up with both of them there", "Example: \u201cLet's set this follow up to where your husband can be there and we can go over everything together.\u201d"]}]}, {"title": "Find more opportunities door to door", "scores": ["Hunting"], "blocks": [{"lead": "What's happening:", "items": ["Door knocking isn't turning up as many opportunities as it needs to", "Joey prospects consistently and bounces back from rejection", "The willingness to prospect, walk-in comfort, and scheduling meetings at the door are the parts of Hunting not yet in place"]}, {"lead": "Joey:", "items": ["Hit a weekly door-knocking number agreed on with Titus", "At every door, aim to schedule the next meeting before you leave"]}, {"lead": "Titus:", "items": ["Review the weekly door-knocking number with Joey each week", "Knock doors alongside Joey regularly; it consistently helps"]}]}, {"title": "Handle the situations that aren't cookie-cutter", "scores": ["Sales Process", "Comfortable Discussing Money", "Supportive Buy Cycle"], "blocks": [{"lead": "What's happening:", "items": ["Unusual insurance policies, more money out of the homeowner's pocket, and approval issues are hard to work through with the homeowner or the insurance company", "Without a step-by-step process to lean on, tougher situations get handled on the fly", "Talking about money feels uncomfortable; the amounts themselves aren't the issue"]}, {"lead": "Joey:", "items": ["Bring up out-of-pocket cost early and plainly; practice until it feels like talking about coffee", "Treat \u201cwe need to think it over\u201d as a stall to address before leaving, not a yes that's coming later"]}, {"lead": "Titus:", "items": ["Walk the team through the sales process: the steps to hit every time, and what goes wrong at the end when each one is missed", "When a deal stalls, ask Joey \u201cWhat happened at the end of that one?\u201d and trace it back to the step that was missed"]}]}, {"title": "How Joey works best", "scores": ["Motivation", "Coachable", "Figure-It-Out-Factor", "Commitment"], "blocks": [{"lead": "Motivated by clear personal and financial goals:", "items": ["Build a 12-month goal board: what Joey wants to accomplish this year and what it will take to get there"]}, {"lead": "Does his best work with outside accountability:", "items": ["Regular check-ins and knocking doors alongside Titus keep things moving", "When left fully on his own, things tend to slip"]}, {"lead": "Wants to know why, not just what:", "items": ["Titus explains the reason behind each step; Joey likes structure and detail"]}, {"lead": "Learns new skills through repetition:", "items": ["Expect to cover a new skill more than once before it sticks", "Very coachable and open to feedback"]}, {"lead": "Commitment is below target:", "items": ["Three years into sales, this often means not yet knowing exactly what to commit to", "A written process and written goals give Joey something specific to commit to"]}]}];
const BELIEFS = [["I need to educate my prospects", "I need to diagnose the issue"], ["Earning more money isn't that important to me", "I am motivated by earning more money"], ["I prefer to do most of the speaking in a customer conversation", "It is more important to listen than speak in a customer conversation"], ["I have to work with the procurement department before I can call on end users or decision-makers", "I have the ability to call on decision makers"], ["I'm uncomfortable asking prospects how much money they have", "I am comfortable having financial conversations with prospects"], ["Prospects are honest", "I maintain healthy skepticism about what prospects tell me"], ["Prospects that need time to think before making a decision will eventually buy from me", "Prospects that need time to think before making a decision will not end up doing business with me"], ["It's not necessary to ask prospects about their finances", "Asking prospects about their budget is a normal part of my routine"], ["Rejection wipes me out", "I am rejection proof"]];
const BREAKDOWN = {"Motivation": {"style": [["Extrinsic", 43], ["Intrinsic", 29], ["Altruistic", 2]], "items": [["Enjoys Selling", 1, ""], ["Has Personal Goals", 1, ""], ["Has Written Personal Goals", 1, ""], ["Has Written Personal Goals with Date", 1, ""], ["Meaningful Goals", 1, ""], ["Plan for Reaching Personal Goals", 1, ""], ["System to Track Progress", 0, ""], ["Self-Starter", 1, ""]], "tendencies": ["Loving to win more than hating to lose", "Self-rewarding performance instead of spending money first to create pressure to perform", "Being pressured instead of self-pressure", "Self-management instead of being closely managed", "Self-competition over competing against others", "Satisfaction over recognition"]}, "Supportive Beliefs": {"beliefs": true}, "Supportive Buy Cycle": {"items": [["Does Not Think Over Purchases", 0, "Individuals who tend to think over major purchases are likely to understand and allow their prospects or customers to behave similarly, which will delay closings."], ["Does Not Research", 0, "Individuals who tend to conduct extensive research prior to making purchases in their personal life are likely to make presentations to prospects too early and too often."], ["Does Not Price Shop", 1, "Individuals who place more importance on finding the best price, rather than the greatest value, tend to have difficulty upholding margins, selling value, and competing against lower-priced competitors."], ["Does Not Comparison Shop", 0, "Individuals who tend to shop around, explore options, and make comparisons in their personal life are more likely to accept that behavior from customers, which can make them vulnerable to competitors."], ["High Threshold for Money", 1, "This finding reflects how this individual is likely to respond to the customer's objections to something costing a lot of money, based on how the individual tends to personally think about money."]]}, "Hunting": {"items": [["Will Prospect", 0, "The willingness to prospect for new business is the single most important driver that leads to maintaining pipeline."], ["Prospects Consistently", 1, "Prospecting must be done regularly to keep the pipeline full."], ["Prospects via Phone and / or Walk-ins", 0, "If the role requires it, individuals should be comfortable making \"cold calls\" (where the prospective customer doesn't know you)."], ["Has No Need for Approval", 1, "While hunting for new business, it is important for individuals to be able to stay objective about negative interactions with prospects."], ["Schedules Meetings", 0, "Being able to meet with prospects gives an individual a great start to filling their pipeline."], ["Recovers from Rejection", 1, "The ability to handle rejection allows an individual to swiftly move on from one opportunity to the next without needing time to recover or becoming emotionally drained."], ["Maintains Full Pipeline", 0, "Individuals should understand the importance of maintaining a full pipeline when hunting for new opportunities."], ["Not a Perfectionist or it Does Not Prevent Prospecting", 1, "Perfectionism should not delay opportunities."], ["Believes They Are Quickly Liked by Customers", 1, "When customers tend to quickly like an individual, it can open the door to more engagement while hunting for opportunities."], ["Reaches Target Prospect", 1, "Individuals should be able to get beyond gatekeepers and waste little time in the process, allowing them to discover more opportunities."], ["Gets Referrals from Customers / Network", 0, "When appropriate, individuals should work to regularly receive referrals and introductions from existing customers."], ["Uses Social Selling Tools", 0, "Having strength in the Social Selling Competency gives an individual another channel they can harness to find new opportunities."], ["Attends Networking Events", 0, "Networking events can often be used to discover additional opportunities."]]}, "Reaching Decision-Makers": {"items": [["Calling on Actual Decision Maker", 0, "The tendency to speak with the final decision maker allows individuals to uncover the real problems, discover the actual budget, learn what it will take to win the business, and shorten the sales cycle."], ["Believes Speaking with Decision Makers Is Required", 0, "Individuals who understand the importance of having a conversation with the decision-maker have an advantage over salespeople who do not."], ["Reaching Decision Maker Is Milestone in Sales Process", 0, "Reaching the decision maker should be a milestone in an effective sale process."], ["Does Not Need to be Liked", 1, "Having strength in the Doesn't Need Approval Competency helps individuals push prospects to put them in touch with the actual decision maker."], ["Doesn't Begin Sales Process with Procurement", 0, "Individuals should not feel compelled to call on purchasing agents, beginning their sales process instead with people who have problems that they can solve."], ["Uses Selling Skills to Reach Decision Maker", 0, "Individuals who have strategies and tactics to help them reach decision makers are better able to uncover compelling reasons those customers would buy from them."], ["Navigates Stakeholders Effectively", 1, "Individuals who are able to consider the unique needs of each stakeholder involved in a buying decision are better positioned to understand and address the challenges of the prospective client organization."]]}, "Relationship Building": {"items": [["Quickly Develops Rapport", 1, "The ability to quickly develop rapport during the first conversation helps prospects feel more comfortable."], ["Relationship Is Key Factor in Winning Business", 0, "Individuals who sell in an industry where relationships are the key factor in getting, maintaining, and growing business tend to place extra importance on building relationships."], ["Relationships Generate New Business", 0, "Individuals should be able to build the kind of relationships that generate referrals and introductions that convert to business."], ["Develops Strong Relationships over Time", 1, "Individuals should be able to develop strong rapport, and also have long-term ongoing relationships with customers."], ["Customers Follow to New Companies", 1, "Past customer relationships strong enough that the customer has followed you to a new job demonstrates the ability to build strong relationships."], ["Believes That Making Friends Is Single Greatest Asset", 0, "Individuals who view making friends with prospects and customers as the single most important thing they do may find it easier to build relationships."], ["Extroversion Supports Relationship Building", 0, "The tendency not to self-identify as an extrovert could (but doesn't necessarily) mean that an individual doesn't enjoy building relationships."]]}, "Consultative Selling": {"items": [["Able to Stay in the Moment", 0, "Staying in the moment allows an individual to respond appropriately and maintain control of the conversation, instead of worrying or preparing a rebuttal."], ["Uncovers Reasons to Buy", 1, "An individual should listen to their prospects and learn why they would make a purchase."], ["Reasons to Buy Are Compelling", 1, "Uncovering compelling reasons why a prospect would buy can accelerate a sales cycle by encouraging customers to act quickly."], ["Able to Listen/Ask with Ease", 1, "Individuals should have the ability to listen to customers and avoid dominating the conversation."], ["Asks Enough Questions", 1, "Individuals who ask lots of questions give prospects an opportunity to share their concerns, opinions, and budget."], ["Asks Great Questions", 1, "Asking great questions helps uncover important information, differentiates individuals from the competition, and shortens the sales process."], ["Gets Prospects Past \"Nice to Have\"", 0, "Individuals should have the ability to get prospects to view what they are selling as something the prospect MUST HAVE, as opposed to something that is nice to have."], ["Will Build Trust", 1, "Building ld firm when a prospect asks for a lower price helps individuals keep the focus of conversations on value as opposed to price."], ["Sales Process Supports Selling Value", 0, "An effective sales process should consist of the important milestones that support identifying value opportunities for prospects."], ["Learns Why Prospects Will Buy", 1, "Individuals should listen to customers to determine why they will make a purchase, which helps that individual keep the conversation on those reasons instead of price."], ["Doesn't Need Approval", 1, "Strength in the Doesn't Need Approval Competency helps individuals push back when a prospect is focused more on price than value."], ["Asks Great Questions", 1, "Asking great questions allows individuals to uncover insights that help them find ways to sell on value over price."], ["Asks Enough Questions", 1, "The tendency to ask lots of questions will help individuals uncover opportunities to help prospects focus on the value of their solution as opposed to the price."], ["Avoids Making Assumptions", 1, "Individuals who do not tend to make assumptions are able to dig deeper into a prospect's needs and discover opportunities to articulate the value of their solution."], ["Quickly Develops Rapport", 1, "Being able to quickly develop rapport with prospects helps individuals steer conversations with prospects away from price and keep the focus on value."], ["Not Compelled to Quote", 1, "Individuals who are careful to only create quotes or proposals when they know they are going to win the business are able to avoid inadvertently shifting the focus to price when it should be on value."]]}, "Qualifying": {"items": [["Meets with Decision Maker", 0, "Strength in the Reaching Decision-Makers Competency helps individuals get the information they need to fully qualify opportunities."], ["Uncovers Actual Budget", 1, "Individuals who are successful at getting prospects to share how much money they can spend are better able to properly qualify tendency to expect positive outcomes in selling situations helps make a positive impression on prospects and makes prospects more comfortable."], ["Sales Assertiveness", 1, "Individuals should exhibit an appropriate amount of assertiveness with customers, being neither too timid nor too overconfident."], ["Sales Empathy", 0, "Individuals should have a good combination of being able to empathize with their prospects' problems while not empathizing with their prospects' stalls, put-offs, objections, and excuses."], ["Appropriate Amount of Patience", 1, "Individuals should exhibit an appropriate amount of patience with prospects and customers, not being too impatient to appear pushy and not being too patient to accept stalling tactics."], ["Will Build Trust", 1, "Strength in the Building Trust Competency helps an individual be memorable and make a lasting impression."], ["Good Listener", 1, "During conversations, listening far more than you talking helps customers feel understood and positively differentiates the individual."], ["Healthy Skepticism", 0, "Not being overly trusting of prospects makes individuals more comfortable asking questions and also more memorable."]]}, "Negotiating": {"items": [["Seeks Win/Win", 1, "Individuals who are strong negotiators tend to find \"win/win\" outcomes, where both they and their customer get something they want."], ["Willing to Walk", 0, "An important strategy while negotiating is being willing to walk away from negotiations if they are not going well."], ["Manages Appropriate Amount of Patience", 1, "Individuals should exhibit an appropriate amount of patience while negotiating, not being too impatient to appear pushy and not being too patient to accept stalling tactics."], ["Able to Listen/Ask with Ease", 1, "Individuals who know the value of listening more than talking are able to uncover advantages during a negotiation."], ["Able to Stay in the Moment", 0, "When negotiating, individuals should be able to remain focused and not allow emotions to cloud their objectivity."], ["Goal Oriented", 1, "Strong organizational tendencies in an individual's personal goal management also help them with the organizational skills necessary to successfully negotiate complex situations."], ["Problem Solver", 0, "Successful negotiation involves thinking of solutions, as opposed to worrying about problems or getting consumed by them."], ["Doesn't Need to be Liked", 1, "Individuals should be willing to accept that a negotiation may negatively impact how much a customer likes them."], ["Rejection Proof", 1, "The ability to swiftly recover from rejection allows an individual to respond during negotiations."], ["Selling Value", 0, "Strength in the Selling Value Competency helps individuals identify positive outcomes in negotiations."], ["Will Discuss Finances", 0, "Individuals with the ability to discuss money with a great deal of ease are able to more effectively negotiate aspects of an opportunity related to money or challenge a prospect's money-related pushback."]]}, "Building Trust": {"items": [["Gains Trust Early", 1, "Individual should be able to get their prospects to trust them early in their conversations, helping establish credibility."], ["High Integrity Seller", 0, "Individuals who, when faced with conflicting business choices, favor honoring existing commitments over new opportunity tend to be able to build strong trust with customers."], ["Customers Share Information Early", 1, "When customers share information early in the sales process, it opens the door to take a consultative approach."], ["Gets First Call from Customers", 1, "An individual should strive to have their customers consult or include them early in the planning process, suggesting they are more inclined to give them their business."], ["Quickly Develops Rapport", 1, "Building rapport on the first call/meeting supports the ability to quickly build trust."], ["Believes They Are Quickly Liked by Customers", 1, "Individuals who can quickly build rapport tend to build more trust with their customers."]]}, "Account Management": {"items": [["Has Strong Relationships", 0, "Strong abilities in the Relationship Building Competency also support an individual's ability to form the long-running relationships necessary to be an effective account manager."], ["Will Handle Organizational Politics", 1, "When a customer exhibits unpredictable behavior, it is useful to try to discover why instead of making assumptions."], ["Will Make Friends Everywhere", 0, "The desire to be considered a friend and/or liked by customers is non-supportive in other areas of sales, but can help an individual be a more effective account manager."], ["Will Follow Up Often", 1, "An individual's tendency to follow up often with customers helps ensure that they will be viewed as a trusted resource and provides that individual with more opportunities to develop additional opportunities."], ["Will Meet/Talk with Decision Makers", 0, "Being strong in the Reaching Decision Makers Competency also helps account managers move beyond their usual contact to the actual decision maker when needed."], ["Will Know the Real Budgets", 1, "Getting customers to share their budget helps account managers uncover additional opportunities."], ["Won't Feel Urgency to Close Business", 0, "When an individual is patient regarding getting commitments from customers, it makes customers more comfortable and helps them see the individual as a trusted resource."], ["Won't Alienate People", 0, "While enjoying the approval of customers is a negative for other areas of sales, it is helpful in account management."], ["Will Focus on Current Accounts Rather than Looking for New Accounts", 1, "Individuals who are not inclined to hunt for new customers tend to focus on managing existing customers as opposed to hunting for new ones, making them more effective at account management."], ["Will Manage Time Effectively", 0, "Excellent organizational skills help an individual be an effective account manager."]]}, "Farming": {"items": [["Attempts to Close", 0, "Individuals should place tremendous importance on getting a customer to agree to decide, and consistently get customers to agree to decide before trying to close."], ["Has Closing Urgency", 1, "When a customer asks someone to follow up about a decision later, that individual should appropriately push back to discover why."], ["Won't \"Understand\" Most Objections", 0, "Individuals with supportive buying habits in their personal life are less likely to sympathize with customers' objections."], ["Won't Panic Over Objections", 0, "Being strong in the Stays in the Moment Competency allows individuals to stay objective when existing customers have objections."], ["Handles \"It's a Lot of Money\" Objection", 1, "Individuals with a healthy perspective on value can respond appropriately when a customer objects to something costing a lot."], ["Won't Accept Put Offs", 1, "Individuals must be able to avoid put offs when scheduling meetings with their existing customers or trying to close opportunities."], ["Believes They Are Quickly Liked by Customers", 1, "When an individual is quickly liked by customers and/or they are able to quickly build rapport, they are able to gain more business from existing customers."], ["Won't Alienate Customers", 0, "Individuals who swiftly recover from rejection and move on to other opportunities run the risk of alienating customers when their role is growing a small number of key accounts."], ["Unlikely to be Distracted by New Accounts", 1, "Individuals who don't enjoy hunting for new customers tend to be able to place more energy on getting more business from existing customers."]]}, "Working Remotely": {"items": [["Works Independently", 1, ""], ["Effective Time Management", 0, ""], ["Self-Starter", 1, ""], ["CRM Savvy", 0, ""], ["Video Proficient", 0, ""]]}};
const DEFS = {"Desire": "How badly an individual wants to achieve greater success in sales.", "Commitment": "The willingness to do, ethically, whatever it takes to achieve greater success in sales.", "Responsibility": "Excuse-making. Whether or not someone takes responsibility for their results and the excuses they make.", "Outlook": "How an individual feels about themselves, the work they\u2019re doing, the company they\u2019re working for and the people they\u2019re working with.", "Motivation": "The \u2018what\u2019 that fuels desire to achieve greater success in sales.", "Doesn't Need Approval": "In other words, \u2018doesn\u2019t need to be liked.\u2019", "Stays in the Moment": "Ability to remain in the \u2018right here\u2019 and \u2018right now\u2019 even when under pressure.", "Comfortable Discussing Money": "How comfortable an individual is digging in and asking the tough questions about money.", "Supportive Buy Cycle": "How a salesperson goes about the process of making a major purchase for themselves.", "Supportive Beliefs": "Specific beliefs that support success in sales.", "Handles Rejection": "Whether a salesperson fears being rejected", "Hunting": "The ability to find new business or opportunities.", "Relationship Building": "The ability to quickly build, develop and maintain relationships with customers.", "Reaching Decision-Makers": "The ability to reach and meet with the actual decision-makers.", "Consultative Selling": "The ability to ask the right amount and right type of questions to uncover compelling reasons to buy.", "Selling Value": "The ability to sell value instead of price.", "Qualifying": "The ability to fully and thoroughly qualify an opportunity.", "Presentation Approach": "The ability to present the right ideas to the right people at the right time for the right reasons.", "Closing": "The ability to get commitments and decisions when an opportunity becomes closable.", "Sales Process": "Having and following a sales process that leads to a predictive and consistent outcome.", "Sales Technology": "The ability and willingness to successfully adapt sales technology into their process", "Coaching": "Measures a sales manager\u2019s ability to coach their team, combining management skills with strong sales expertise to model and coach effective selling practices.", "Motivating": "Measures sales manager's ability to understand what motivates their salespeople and how they can keep them motivated.", "Accountability": "Measures if a manager holds their salespeople accountable to measurable, forward-looking metrics.", "Recruiting": "Measures a sales manager's abilities to interview and select salespeople who will positively contribute to the organization.", "Pipeline Management": "Measures how thoroughly and effectively a sales manager will manage the pipeline and coach from the pipeline.", "Team-Focused": "Measures whether a sales manager focuses on the team rather than themself, meaning they will give the team credit when it succeeds and take responsibility when it fails.", "Sales Posturing": "Measures an individual's ability to make positive first impressions, differentiate themselves, and be memorable.", "Negotiating": "Measures an individual's ability to effectively negotiate terms, prices, and conditions throughout the sales process.", "Building Trust": "Measures whether an individual is seen as trustworthy by their customers and prospects.", "Account Management": "Measures an individual's ability to manage, maintain, and grow multiple assigned accounts.", "Farming": "Measures an individual's ability to grow a small number of key accounts", "Working Remotely": "Measures an individual's ability to effectively work remotely without close supervision.", "Compatibility": "Compares a company's role-specific requirements to the areas of selling that a salesperson indicates are comfortable.", "Alignment": "Compares a manager's personal strategies to the company's strategies."};
const defFor = k => DEFS[k] || null;

/* ---- OMG target zones (from the SEIA Analyzer) ---- */
const Z = {
  will: {'Desire':[59,59],'Commitment':[59,59],'Outlook':[74,74],'Motivation':[66,66],'Responsibility':[49,49]},
  dev: {'Will to Sell':[59,59],'Coachable':[74,74],'Figure-It-Out-Factor':[49,74]},
  dna: {"Doesn't Need Approval":[85,85],'Stays in the Moment':[87,87],'Supportive Beliefs':[85,85],'Supportive Buy Cycle':[69,69],'Comfortable Discussing Money':[65,65],'Handles Rejection':[49,49]},
  thirds: [33,66],
  relBuild: [33,49],
};
const SECTION = {};
['will','dev','dna','tac','other'].forEach(s => Object.keys(DATA[s]).forEach(k => SECTION[k] = s));
const zoneFor = key => {
  const s = SECTION[key];
  if (s==='will') return Z.will[key];
  if (s==='dev') return Z.dev[key];
  if (s==='dna') return Z.dna[key];
  if (key==='Relationship Building') return Z.relBuild;
  return Z.thirds;
};
const valFor = key => DATA[SECTION[key]][key];
const zColor = (v, zone) => v==null ? 'var(--faint)' : v < zone[0] ? 'var(--bad)' : v < zone[1] ? 'var(--mid)' : 'var(--good)';
const zName = (v, zone) => v==null ? 'not assessed' : v < zone[0] ? 'Below target' : v < zone[1] ? 'Approaching' : 'On target';
const slug = s => 'g-' + s.toLowerCase().replace(/[^a-z0-9]+/g,'-');



/* ---- gauge SVG ---- */
function arcPath(cx, cy, r, a0, a1){
  const p = a => [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  const [x0,y0] = p(a0), [x1,y1] = p(a1);
  return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${(a1-a0)>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}
const A0 = Math.PI, SPAN = Math.PI;
const ang = pct => A0 + SPAN * Math.min(100,Math.max(0,pct)) / 100;

function gauge(label){
  const v = valFor(label), zone = zoneFor(label);
  const cx=85, cy=80, r=62, w=13;
  const seg = (from,to,color) => to>from ? `<path d="${arcPath(cx,cy,r,ang(from),ang(to))}" stroke="${color}" stroke-width="${w}" fill="none" stroke-linecap="butt"/>` : '';
  const arcs = seg(0, zone[0], '#e5b1b1') + seg(zone[0], zone[1], '#ecd3a0') + seg(zone[1], 100, '#a9d4bd');
  let needle = '';
  if (v!=null){
    const a = ang(v);
    const x = cx + (r-2)*Math.cos(a), y = cy + (r-2)*Math.sin(a);
    needle = `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#1d2733" stroke-width="3" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="5" fill="#1d2733"/>`;
  }
  const col = zColor(v, zone);
  const info = defFor(label) ? `<button class="info-btn" aria-expanded="false" aria-label="What ${label} measures" data-def="${label}">i</button>` : '';
  const bd = BREAKDOWN[label] ? ` has-bd" role="button" tabindex="0" data-bd="${label}` : '';
  return `<div class="gauge${bd}" id="${slug(label)}">
    <div class="gl"><span>${label}</span>${info}</div>
    <svg viewBox="0 0 170 92" role="img" aria-label="${label}: ${v==null?'not assessed':v}">${arcs}${needle}</svg>
    <div class="gv" style="color:${col}">${v==null?'—':Math.round(v)}</div>
    <div class="gz" style="color:${col}">${zName(v,zone)}</div>
    ${BREAKDOWN[label] ? '<div class="bdlink">See breakdown</div>' : ''}
  </div>`;
}
const gaugeGrid = sec => `<div class="gauges">${Object.keys(DATA[sec]).map(gauge).join('')}</div>`;

function render(){
  let html = '';

  /* focus areas */
  html += `<h2>Focus Areas</h2><div class="focus">`;
  FOCUS.forEach((f,i)=>{
    const chips = f.scores.map(k=>{
      const v = valFor(k), col = zColor(v, zoneFor(k));
      return `<button class="chip" data-target="${slug(k)}">${k} <b style="color:${col}">${Math.round(v)}</b></button>`;
    }).join('');
    const blocks = f.blocks.map(b=>`<div class="blk"><div class="lead">${b.lead}</div><ul>${b.items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`).join('');
    html += `<details class="fcard" id="focus-${i+1}"${i===0?' open':''}>
      <summary><span class="fnum">${i+1}</span><span class="ftitle">${f.title}</span><span class="chev"></span></summary>
      <div class="fbody"><div class="chips">${chips}</div>${blocks}</div>
    </details>`;
  });
  html += `</div>`;

  html += `<h2>Self-Limiting Beliefs</h2>
  <details class="callout">
    <summary><span class="ctitle">Current beliefs and the beliefs to build in their place</span><span class="chev"></span></summary>
    <div class="cbody"><div class="bel">${BELIEFS.map(b=>`<div class="belrow"><div class="belnow">${b[0]}</div><div class="belnew">${b[1]}</div></div>`).join('')}</div></div>
  </details>`;

  html += `<h2>The Will to Sell Competencies</h2><div class="panel">${gaugeGrid('will')}</div>`;
  html += `<h2>Development</h2><div class="panel">${gaugeGrid('dev')}</div>`;
  html += `<h2>Sales DNA Competencies</h2><div class="panel">${gaugeGrid('dna')}
    <p class="note">Sales DNA targets are set by OMG per competency (e.g. Doesn't Need Approval must reach the 85th mark to count as a strength) — these are deliberately higher bars than the tactical thirds.</p></div>`;
  html += `<h2>Tactical Competencies</h2><div class="panel">${gaugeGrid('tac')}</div>`;
  html += `<h2>Other Competencies &amp; Scores</h2><div class="panel">${gaugeGrid('other')}</div>
  <div class="legend">
    <span><span class="sw" style="background:#a9d4bd"></span>On target</span>
    <span><span class="sw" style="background:#ecd3a0"></span>Approaching</span>
    <span><span class="sw" style="background:#e5b1b1"></span>Below target</span>
  </div>`;
  document.getElementById('main').innerHTML = html;
}
render();


/* ---- breakdown focus view ---- */
const detail = document.getElementById('detail');
const rowsHTML = items => items.map(([t,y,d])=>`<div class="drow"><span class="dico ${y?'y':'n'}"></span><div><div class="t">${t}</div>${d?`<div class="d">${d}</div>`:''}</div></div>`).join('');
function openDetail(label, push=true){
  const b = BREAKDOWN[label]; if (!b) return;
  const v = valFor(label), zone = zoneFor(label), col = zColor(v, zone);
  let h = `<div class="dtop"><button class="dclose" id="dclose">Close</button></div>
    <div class="dname">${DATA.name}</div>
    <div class="dtitle">${label}</div>
    <div class="dscore"><span class="n" style="color:${col}">${Math.round(v)}</span><span class="z" style="color:${col}">${zName(v,zone)}</span></div>
    ${defFor(label)?`<p class="ddef">${defFor(label)}</p>`:''}`;
  if (b.style){
    h += `<div class="dgroup"><h3>Motivational Style: ${b.style[0][0]}</h3><div class="mstyle">${b.style.map(([n,x],i)=>`<div class="mbar${i?' dim':''}"><div class="ml"><span>${n}</span><span>${x}</span></div><div class="track"><div class="fill" style="width:${x}%"></div></div></div>`).join('')}</div></div>`;
  }
  if (b.beliefs){
    h += `<div class="dgroup"><h3>Current beliefs and the beliefs to build</h3>${BELIEFS.map(([a,c])=>`<div class="drow"><div><div class="belnow">${a}</div><div class="belnew">${c}</div></div></div>`).join('')}</div>`;
  }
  if (b.items){
    const no = b.items.filter(i=>!i[1]), yes = b.items.filter(i=>i[1]);
    if (no.length) h += `<div class="dgroup"><h3>Not yet in place</h3>${rowsHTML(no)}</div>`;
    if (yes.length) h += `<div class="dgroup"><h3>In place</h3>${rowsHTML(yes)}</div>`;
  }
  if (b.tendencies){
    h += `<div class="dgroup"><h3>Motivational Tendencies</h3>${b.tendencies.map(t=>`<div class="drow"><div class="t">${t}</div></div>`).join('')}</div>`;
  }
  document.getElementById('dbody').innerHTML = h;
  detail.classList.add('on'); detail.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  document.getElementById('dclose').onclick = closeDetail;
  if (push) history.pushState(null, '', '#' + slug(label).slice(2));
}
function closeDetail(){
  detail.classList.remove('on');
  document.body.style.overflow = '';
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
const labelFromHash = () => { const h = location.hash.slice(1); return Object.keys(BREAKDOWN).find(k => slug(k).slice(2) === h); };
window.addEventListener('popstate', () => { const l = labelFromHash(); l ? openDetail(l, false) : closeDetail(); });
document.addEventListener('click', e => {
  if (e.target.closest('.info-btn')) return;
  const g = e.target.closest('.gauge.has-bd');
  if (g) openDetail(g.dataset.bd);
});
document.addEventListener('keydown', e => {
  const g = e.target.closest && e.target.closest('.gauge.has-bd');
  if (g && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); openDetail(g.dataset.bd); }
  if (e.key==='Escape' && detail.classList.contains('on')) document.getElementById('dclose').click();
});
{ const l = labelFromHash(); if (l) openDetail(l, false); }

/* ---- chip -> jump to gauge ---- */
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const g = document.getElementById(chip.dataset.target);
  if (!g) return;
  if (g.dataset.bd){ openDetail(g.dataset.bd); return; }
  g.scrollIntoView({behavior:'smooth', block:'center'});
  g.classList.add('flash');
  setTimeout(()=>g.classList.remove('flash'), 1800);
});

/* ---- definition popover ---- */
const pop = document.createElement('div');
pop.id = 'defpop';
document.body.appendChild(pop);
let popBtn = null;
function closePop(){
  pop.style.display = 'none';
  if (popBtn) popBtn.setAttribute('aria-expanded','false');
  popBtn = null;
}
document.addEventListener('click', e => {
  const btn = e.target.closest('.info-btn');
  if (!btn){ if (!e.target.closest('#defpop')) closePop(); return; }
  if (btn === popBtn){ closePop(); return; }
  closePop();
  const key = btn.dataset.def;
  pop.innerHTML = `<div class="dp-title">${key}</div>${defFor(key)}`;
  pop.style.display = 'block';
  const r = btn.getBoundingClientRect();
  const pw = Math.min(280, window.innerWidth - 24);
  pop.style.maxWidth = pw + 'px';
  let left = r.left + window.scrollX + r.width/2 - pw/2;
  left = Math.max(12, Math.min(left, window.scrollX + window.innerWidth - pw - 12));
  pop.style.left = left + 'px';
  pop.style.top = (r.bottom + window.scrollY + 8) + 'px';
  pop.style.setProperty('--arrow', (r.left + window.scrollX + r.width/2 - left - 6) + 'px');
  btn.setAttribute('aria-expanded','true');
  popBtn = btn;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
window.addEventListener('scroll', closePop, {passive:true});
</script>
